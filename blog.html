<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Blog | Suraj Gaud</title>
    <meta id="meta-description" name="description" content="Essays by Suraj Gaud on AI infrastructure, eval-driven development, and distributed systems.">
    <link id="meta-canonical" rel="canonical" href="https://surajgaud.github.io/blog.html">
    <meta id="meta-og-type" property="og:type" content="article">
    <meta id="meta-og-title" property="og:title" content="Blog | Suraj Gaud">
    <meta id="meta-og-description" property="og:description" content="Essays by Suraj Gaud on AI infrastructure, eval-driven development, and distributed systems.">
    <meta id="meta-og-url" property="og:url" content="https://surajgaud.github.io/blog.html">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@surajgaud_">
    <meta id="meta-twitter-title" name="twitter:title" content="Blog | Suraj Gaud">
    <meta id="meta-twitter-description" name="twitter:description" content="Essays by Suraj Gaud on AI infrastructure, eval-driven development, and distributed systems.">
    <script id="ld-blogposting" type="application/ld+json"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .article-shell { max-width: 720px; margin: 0 auto; padding: 130px 28px 40px; position: relative; z-index: 1; }

        .back-link {
            display: inline-flex; align-items: center; gap: 9px; white-space: nowrap;
            font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--text-2); text-decoration: none; margin-bottom: 40px;
            padding: 8px 16px 8px 12px; border: 1px solid var(--border); border-radius: 100px;
            transition: color 0.2s, border-color 0.2s, transform 0.2s var(--ease), gap 0.2s;
        }
        .back-link:hover { color: var(--terracotta); border-color: var(--terracotta); gap: 12px; }

        .article-meta {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase;
            color: var(--text-3); margin-bottom: 22px;
        }
        .article-meta span { white-space: nowrap; }
        .article-meta .tag { color: var(--terracotta); }

        .blog-post h1 {
            font-family: var(--font-display);
            font-size: clamp(2.2rem, 5vw, 3.2rem); font-weight: 700; letter-spacing: -0.03em;
            line-height: 1.08; color: var(--text); margin-bottom: 40px; text-wrap: balance;
        }
        .blog-post h2 {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 3vw, 1.9rem); font-weight: 600; letter-spacing: -0.02em;
            color: var(--text); margin: 3rem 0 1.2rem; line-height: 1.2;
        }
        .blog-post h3 {
            font-family: var(--font-display);
            font-size: 1.3rem; font-weight: 600; color: var(--text); margin: 2.2rem 0 1rem;
        }
        .blog-post p { font-size: 1.16rem; line-height: 1.8; color: var(--text-2); margin-bottom: 1.5rem; }
        .blog-post strong { color: var(--text); font-weight: 600; }
        .blog-post em { font-style: italic; }
        .blog-post a {
            color: var(--text); text-decoration: none;
            background-image: linear-gradient(var(--terracotta), var(--terracotta));
            background-size: 100% 1.5px; background-repeat: no-repeat; background-position: 0 100%;
            transition: background-size 0.3s var(--ease), color 0.2s;
        }
        .blog-post a:hover { color: var(--terracotta); background-size: 100% 100%; }
        .blog-post ul, .blog-post ol { margin: 0 0 1.5rem 1.4rem; }
        .blog-post li { font-size: 1.16rem; line-height: 1.8; color: var(--text-2); margin-bottom: 0.6rem; }
        .blog-post li::marker { color: var(--terracotta); }
        .blog-post blockquote {
            border-left: 2px solid var(--terracotta); padding: 4px 0 4px 24px; margin: 2rem 0;
            font-family: var(--font-display); font-size: 1.3rem; font-style: normal; font-weight: 500;
            color: var(--text); line-height: 1.5;
        }
        .blog-post hr { border: 0; height: 1px; background: var(--border); margin: 3rem 0; }
        .blog-post code {
            background: var(--bg-2); padding: 0.15rem 0.45rem; border-radius: 5px;
            font-family: var(--font-mono); font-size: 0.86em; color: var(--terracotta);
        }
        .blog-post pre {
            background: var(--bg-2); border: 1px solid var(--border-2);
            padding: 1.4rem; border-radius: 14px; overflow-x: auto; margin-bottom: 1.5rem;
        }
        .blog-post pre code { background: none; padding: 0; color: var(--text-2); }

        .article-foot { margin-top: 64px; padding-top: 32px; border-top: 1px solid var(--border-2); }

        .loading-state, .error-state { text-align: center; color: var(--text-2); padding: 5rem 2rem; }
        .error-state h2 { font-family: var(--font-display); color: var(--text); margin-bottom: 1rem; }
    </style>
</head>

<body>
    <div class="bg-base" aria-hidden="true"></div>
    <div class="ambient" aria-hidden="true">
        <div class="wash"></div>
        <div class="wash two"></div>
        <div class="wash three"></div>
    </div>
    <div class="grain" aria-hidden="true"></div>

    <nav class="navbar" id="navbar">
        <a href="index.html" class="brand">
            <span class="brand-text-wrapper">
                <span class="brand-text-primary">Suraj Gaud</span>
                <span class="brand-text-secondary">सूरज गौड़</span>
            </span><span class="dot">.</span>
        </a>
        <div class="nav-right">
            <div class="nav-links">
                <a href="index.html#about" class="nav-link">About</a>
                <a href="index.html#writing" class="nav-link">Writing</a>
                <a href="index.html#now" class="nav-link">Now</a>
            </div>
            <button class="icon-btn theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
                <i class="fa-solid fa-sun sun"></i>
                <i class="fa-solid fa-moon moon"></i>
            </button>
        </div>
    </nav>

    <main class="article-shell">
        <a href="index.html#writing" class="back-link"><i class="fa-solid fa-arrow-left"></i> All writing</a>
        <article class="blog-post" id="blog-content">
            <div class="loading-state"><p>Loading…</p></div>
        </article>
    </main>

    <script>
        /* Theme */
        const root = document.documentElement;
        const stored = localStorage.getItem('sg-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        root.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));
        document.getElementById('themeToggle').addEventListener('click', () => {
            const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            localStorage.setItem('sg-theme', next);
        });

        /* Brand Hindi toggle */
        const brandWrapper = document.querySelector('.brand-text-wrapper');
        setInterval(() => brandWrapper.classList.toggle('show-hindi'), 4000);

        /* Navbar shadow */
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => navbar.classList.toggle('tucked', window.scrollY > 20), { passive: true });

        /* Render post */
        const mdFile = new URLSearchParams(window.location.search).get('post');
        const META = {
            'data/eval_driven_development_for_aoe2_copilot.md': {
                tag: 'Essay', date: 'July 2026', iso: '2026-07-01', read: '9 min read',
                desc: "Building a real-time AoE2 copilot: spend the LLM only where judgment lives, run everything below it as deterministic reflexes, and test the whole thing with eval-driven development because TDD structurally can't."
            },
            'data/the_philosophy_of_the_permeable_mind.md': {
                tag: 'Essay', date: 'June 2026', iso: '2026-06-01', read: '2 min read',
                desc: 'On treating LLMs not as isolated chatbots but as a cognitive layer over our data: MCP, RAG, and designing the silent weaver.'
            }
        };
        if (!mdFile) {
            document.getElementById('blog-content').innerHTML =
                '<div class="error-state"><h2>No post specified</h2><p>Head back to <a href="index.html#writing">all writing</a>.</p></div>';
        } else {
            render(mdFile);
        }
        async function render(filePath) {
            try {
                const res = await fetch(filePath);
                if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
                const md = await res.text();
                const basePath = filePath.slice(0, filePath.lastIndexOf('/') + 1);
                const baseUrl = new URL(basePath, window.location.href);
                const fixedMd = md.replace(/(<img\b[^>]*?\bsrc=["'])(\.\/[^"'>]+)(["'][^>]*>)/gi,
                    (_, prefix, src, suffix) => prefix + new URL(src, baseUrl).href + suffix);
                const renderer = new marked.Renderer();
                renderer.image = function (href, title, text) {
                    if (href && !/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(href) && !href.startsWith('/')) {
                        href = new URL(href, baseUrl).href;
                    }
                    return marked.Renderer.prototype.image.call(this, href, title, text);
                };
                marked.setOptions({ breaks: true, gfm: true, headerIds: true, mangle: false, renderer });
                // pull first H1 out as the styled title + meta
                const lines = fixedMd.split('\n');
                let title = '';
                const idx = lines.findIndex(l => /^#\s+/.test(l));
                if (idx > -1) { title = lines[idx].replace(/^#\s+/, '').trim(); lines.splice(idx, 1); }
                const body = marked.parse(lines.join('\n'));
                const m = META[filePath] || { tag: 'Essay', date: '', read: '' };
                // Canonicalize onto the pre-rendered static page (essays/<slug>.html), which ships
                // real markup for crawlers that don't execute JS. blog.html itself keeps working
                // for direct/bookmarked visits, it just isn't the URL search engines should index.
                const slug = filePath.replace(/^data\//, '').replace(/\.md$/, '');
                const pageUrl = window.location.origin + '/essays/' + slug + '.html';
                if (title) {
                    document.getElementById('page-title').textContent = title + ' | Suraj Gaud';
                    const desc = m.desc || (title + ' — an essay by Suraj Gaud.');
                    document.getElementById('meta-description').setAttribute('content', desc);
                    document.getElementById('meta-canonical').setAttribute('href', pageUrl);
                    document.getElementById('meta-og-title').setAttribute('content', title + ' | Suraj Gaud');
                    document.getElementById('meta-og-description').setAttribute('content', desc);
                    document.getElementById('meta-og-url').setAttribute('content', pageUrl);
                    document.getElementById('meta-twitter-title').setAttribute('content', title + ' | Suraj Gaud');
                    document.getElementById('meta-twitter-description').setAttribute('content', desc);
                    document.getElementById('ld-blogposting').textContent = JSON.stringify({
                        '@context': 'https://schema.org',
                        '@type': 'BlogPosting',
                        headline: title,
                        description: desc,
                        url: pageUrl,
                        datePublished: m.iso || undefined,
                        dateModified: m.iso || undefined,
                        author: { '@type': 'Person', name: 'Suraj Gaud', url: 'https://surajgaud.github.io/#person' },
                        publisher: { '@type': 'Person', name: 'Suraj Gaud' },
                        mainEntityOfPage: { '@type': 'WebPage', '@id': pageUrl }
                    });
                }
                document.getElementById('blog-content').innerHTML =
                    '<div class="article-meta"><span class="tag">' + m.tag + '</span>' +
                    (m.date ? '<span>' + m.date + '</span>' : '') +
                    (m.read ? '<span>· ' + m.read + '</span>' : '') + '</div>' +
                    (title ? '<h1>' + title + '</h1>' : '') + body +
                    '<div class="article-foot"><a href="index.html#writing" class="back-link"><i class="fa-solid fa-arrow-left"></i> All writing</a></div>';
            } catch (e) {
                document.getElementById('blog-content').innerHTML =
                    '<div class="error-state"><h2>Couldn\'t load this post</h2><p>' + e.message +
                    '</p><p><a href="index.html#writing">Back to all writing</a></p></div>';
            }
        }
    </script>
</body>

</html>
