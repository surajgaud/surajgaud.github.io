<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" style="min-width:880px; max-width:100%; height:auto; display:block; background:#211b13; border:1px solid #4a3f2a; border-radius:12px;">
  <title>Coaching pipeline</title>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="#7a6a48"/>
    </marker>
  </defs>

  <text x="28" y="38" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="17" letter-spacing="4" fill="#d4a017" style="text-transform:uppercase;">Coaching Pipeline</text>
  <text x="912" y="38" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11" fill="#a4936f">one tick every 2 s</text>
  <line x1="28" y1="50" x2="912" y2="50" stroke="#4a3f2a" stroke-width="1"/>

  <g stroke="#7a6a48" stroke-width="1.4" fill="none">
    <line x1="142" y1="165" x2="180" y2="165" marker-end="url(#arr)"/>
    <line x1="307" y1="165" x2="345" y2="165" marker-end="url(#arr)"/>
    <path d="M492,165 L524,165 L524,108 L555,108" marker-end="url(#arr)"/>
    <path d="M492,165 L524,165 L524,236 L555,236" marker-end="url(#arr)"/>
    <path d="M762,108 L788,108 L788,152 L810,152" marker-end="url(#arr)"/>
    <path d="M762,236 L788,236 L788,178 L810,178" marker-end="url(#arr)"/>
  </g>

  <g>
    <circle r="3.4" fill="#e9dcbe"><animateMotion dur="4s" begin="0s" repeatCount="indefinite" path="M142,165 L492,165"/></circle>
    <circle r="3.4" fill="#e9dcbe"><animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M142,165 L492,165"/></circle>
    <circle r="3.6" fill="#f0c75e"><animateMotion dur="3.2s" begin="0s"   repeatCount="indefinite" path="M492,165 L524,165 L524,108 L788,108 L788,152 L810,152"/></circle>
    <circle r="3.6" fill="#f0c75e"><animateMotion dur="3.2s" begin="1.1s" repeatCount="indefinite" path="M492,165 L524,165 L524,108 L788,108 L788,152 L810,152"/></circle>
    <circle r="3.6" fill="#f0c75e"><animateMotion dur="3.2s" begin="2.2s" repeatCount="indefinite" path="M492,165 L524,165 L524,108 L788,108 L788,152 L810,152"/></circle>
    <circle r="4"   fill="#5b9bd5"><animateMotion dur="9s"  begin="0s"   repeatCount="indefinite" path="M492,165 L524,165 L524,236 L788,236 L788,178 L810,178"/></circle>
  </g>

  <g font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" text-anchor="middle">
    <rect x="34"  y="138" width="108" height="54" rx="7" fill="#2a2318" stroke="#7a6a48" stroke-width="1.3"/>
    <text x="88"  y="170" font-size="14" letter-spacing="2" fill="#e9dcbe">SCREEN</text>

    <rect x="186" y="138" width="120" height="54" rx="7" fill="#2a2318" stroke="#7a6a48" stroke-width="1.3"/>
    <text x="246" y="170" font-size="14" letter-spacing="2" fill="#e9dcbe">OCR</text>

    <rect x="351" y="138" width="140" height="54" rx="7" fill="#2a2318" stroke="#7a6a48" stroke-width="1.3"/>
    <text x="421" y="170" font-size="14" letter-spacing="2" fill="#e9dcbe">METRICS</text>

    <rect x="558" y="80" width="204" height="56" rx="7" fill="#2a2318" stroke="#d4a017" stroke-width="1.6"/>
    <text x="660" y="103" font-size="14" letter-spacing="2" fill="#f0c75e">ALARMS</text>
    <text x="660" y="122" font-size="10.5" fill="#a4936f" font-family="ui-monospace,'SF Mono',Menlo,monospace">rules · instant · 0 tokens</text>

    <rect x="558" y="208" width="204" height="56" rx="7" fill="#2a2318" stroke="#5b9bd5" stroke-width="1.6"/>
    <text x="660" y="231" font-size="14" letter-spacing="2" fill="#8fbde6">ADVISOR</text>
    <text x="660" y="250" font-size="10.5" fill="#a4936f" font-family="ui-monospace,'SF Mono',Menlo,monospace">LLM · every 30-60 s</text>

    <rect x="812" y="138" width="98" height="54" rx="7" fill="#2a2318" stroke="#7a6a48" stroke-width="1.3"/>
    <text x="861" y="170" font-size="14" letter-spacing="2" fill="#e9dcbe">VOICE</text>
  </g>

  <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10.5" fill="#a4936f" text-anchor="middle">
    <text x="88"  y="210">pixels</text>
    <text x="246" y="210">~10 integers / 5 s</text>
    <text x="421" y="210">rates · floats · pace</text>
    <text x="660" y="72">build order · age-up · float · idle vills</text>
    <text x="660" y="282">strategy · transitions · matchup</text>
    <text x="861" y="210">TTS · alarms preempt</text>
  </g>

  <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11">
    <circle cx="40" cy="308" r="3.6" fill="#f0c75e"/>
    <text x="50" y="312" fill="#a4936f">deterministic callout, free</text>
    <circle cx="248" cy="308" r="4" fill="#5b9bd5"/>
    <text x="258" y="312" fill="#a4936f">LLM call, rare by design</text>
  </g>
</svg>
