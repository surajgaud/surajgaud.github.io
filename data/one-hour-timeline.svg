<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" width="940" style="min-width:880px; max-width:100%; height:auto; display:block; background:#211b13; border:1px solid #4a3f2a; border-radius:12px;">
  <title>One hour of coaching</title>
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0c75e" stop-opacity="0"/>
      <stop offset="1" stop-color="#f0c75e" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <text x="28" y="38" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="17" letter-spacing="4" fill="#d4a017" style="text-transform:uppercase;">One Hour of Coaching</text>
  <text x="912" y="38" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11" fill="#a4936f">whole match ≈ a few cents</text>
  <line x1="28" y1="50" x2="912" y2="50" stroke="#4a3f2a" stroke-width="1"/>

  <path d="M70,78 L70,72 L234,72 L234,78" stroke="#7a6a48" stroke-width="1" fill="none"/>
  <text x="152" y="66" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10.5" fill="#a4936f">scripted opening · LLM silent</text>

  <path d="M466,166 L466,172 L576,172 L576,166" stroke="#456e93" stroke-width="1" fill="none"/>
  <text x="521" y="186" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10.5" fill="#7fa3c4">economy flat · calls skipped</text>

  <line x1="70" y1="122" x2="890" y2="122" stroke="#4a3f2a" stroke-width="2"/>
  <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10.5" fill="#7a6a48" text-anchor="middle">
    <text x="70"  y="206">0:00</text>
    <text x="275" y="206">15:00</text>
    <text x="480" y="206">30:00</text>
    <text x="685" y="206">45:00</text>
    <text x="890" y="206">60:00</text>
  </g>
  <g stroke="#4a3f2a" stroke-width="1">
    <line x1="70"  y1="118" x2="70"  y2="126"/><line x1="275" y1="118" x2="275" y2="126"/>
    <line x1="480" y1="118" x2="480" y2="126"/><line x1="685" y1="118" x2="685" y2="126"/>
    <line x1="890" y1="118" x2="890" y2="126"/>
  </g>

  <g stroke="#f0c75e" stroke-width="2" stroke-linecap="round">
    <line x1="91"  y1="100" x2="91"  y2="116"/><line x1="111" y1="100" x2="111" y2="116"/>
    <line x1="132" y1="100" x2="132" y2="116"/><line x1="145" y1="100" x2="145" y2="116"/>
    <line x1="166" y1="100" x2="166" y2="116"/><line x1="186" y1="100" x2="186" y2="116"/>
    <line x1="207" y1="100" x2="207" y2="116"/><line x1="221" y1="100" x2="221" y2="116"/>
    <line x1="241" y1="94"  x2="241" y2="116"/>
    <line x1="262" y1="100" x2="262" y2="116"/><line x1="289" y1="100" x2="289" y2="116"/>
    <line x1="316" y1="100" x2="316" y2="116"/><line x1="357" y1="94"  x2="357" y2="116"/>
    <line x1="398" y1="100" x2="398" y2="116"/><line x1="439" y1="100" x2="439" y2="116"/>
    <line x1="480" y1="100" x2="480" y2="116"/><line x1="521" y1="100" x2="521" y2="116"/>
    <line x1="549" y1="100" x2="549" y2="116"/><line x1="590" y1="100" x2="590" y2="116"/>
    <line x1="631" y1="100" x2="631" y2="116"/><line x1="672" y1="100" x2="672" y2="116"/>
    <line x1="713" y1="100" x2="713" y2="116"/><line x1="754" y1="100" x2="754" y2="116"/>
    <line x1="795" y1="100" x2="795" y2="116"/><line x1="863" y1="100" x2="863" y2="116"/>
  </g>

  <g fill="#5b9bd5">
    <path d="M255,130 l5,6 l-5,6 l-5,-6 Z"/><path d="M275,130 l5,6 l-5,6 l-5,-6 Z"/>
    <path d="M309,130 l5,6 l-5,6 l-5,-6 Z"/><path d="M343,130 l5,6 l-5,6 l-5,-6 Z"/>
    <path d="M398,130 l5,6 l-5,6 l-5,-6 Z"/><path d="M453,130 l5,6 l-5,6 l-5,-6 Z"/>
    <path d="M590,130 l5,6 l-5,6 l-5,-6 Z"/><path d="M644,130 l5,6 l-5,6 l-5,-6 Z"/>
    <path d="M699,130 l5,6 l-5,6 l-5,-6 Z"/><path d="M760,130 l5,6 l-5,6 l-5,-6 Z"/>
    <path d="M822,130 l5,6 l-5,6 l-5,-6 Z"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="820 0" dur="16s" repeatCount="indefinite"/>
    <rect x="10" y="88" width="60" height="66" fill="url(#trail)"/>
    <line x1="70" y1="86" x2="70" y2="156" stroke="#e9dcbe" stroke-width="1.4" opacity="0.85"/>
  </g>

  <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11">
    <line x1="36" y1="228" x2="36" y2="238" stroke="#f0c75e" stroke-width="2" stroke-linecap="round"/>
    <text x="46" y="237" fill="#a4936f">alarm callout · 0 tokens (~25 per match)</text>
    <path d="M348,228 l4.5,5 l-4.5,5 l-4.5,-5 Z" fill="#5b9bd5"/>
    <text x="360" y="237" fill="#a4936f">LLM call · ~300 uncached tokens (~10-15 per match)</text>
  </g>
</svg>
